<svg xmlns="http://www.w3.org/2000/svg" width="740" height="420" viewBox="0 0 740 420" role="img" aria-labelledby="title description">
  <title id="title">Alder implementation flow</title>
  <desc id="description">Six sequential stages from the core library through profiling and concurrency.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#6283a7"/>
    </marker>
  </defs>
  <g fill="#0d2c4b" stroke="#406e99" stroke-width="1.3">
    <rect x="16" y="4" width="708" height="52" rx="14"/>
    <rect x="16" y="76" width="708" height="52" rx="14"/>
    <rect x="16" y="148" width="708" height="52" rx="14"/>
    <rect x="16" y="220" width="708" height="52" rx="14"/>
    <rect x="16" y="292" width="708" height="52" rx="14"/>
    <rect x="16" y="364" width="708" height="52" rx="14"/>
  </g>
  <g stroke="#6283a7" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M 370 59 V 72"/>
    <path d="M 370 131 V 144"/>
    <path d="M 370 203 V 216"/>
    <path d="M 370 275 V 288"/>
    <path d="M 370 347 V 360"/>
  </g>
  <g fill="#e4f1ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">
    <text x="370" y="37">1. Build and core library (M01–M04)</text>
    <text x="370" y="109">2. Platform independence and runtime (M05–M07)</text>
    <text x="370" y="181">3. Rendering and editor viewport (M08–M10)</text>
    <text x="370" y="253">4. Simulation, animation, and audio (M11–M13)</text>
    <text x="370" y="325">5. Game world and playable sample (M14–M16)</text>
    <text x="370" y="397">6. Profiling and concurrency (M17)</text>
  </g>
</svg>
